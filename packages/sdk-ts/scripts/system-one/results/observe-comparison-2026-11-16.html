<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body{margin:0;font-family:var(--font-sans);color:var(--foreground)}*{box-sizing:border-box}.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:8px 0 16px}.group{display:flex;gap:4px}button{font:inherit;font-size:12px;padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius);color:var(--foreground);background:var(--secondary);cursor:pointer}button.active{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}.context,.note{color:var(--muted-foreground);font-size:12px;line-height:1.5}.context{margin:0 0 12px}.plot{height:225px}.row{padding:8px 0}.label{font-size:13px;margin-bottom:7px;display:flex;justify-content:space-between;gap:12px}.value{font-family:var(--font-mono);font-weight:600}.track{height:15px;background:var(--secondary);border-radius:4px;overflow:hidden}.bar{height:15px;background:var(--chart-1);transition:width .18s}.row.old .bar{background:var(--chart-3)}.row.luna .bar{background:var(--chart-2)}.axis{display:flex;justify-content:space-between;font:11px var(--font-mono);color:var(--muted-foreground);border-top:1px solid var(--border);padding-top:7px;margin-top:10px}.note{margin:8px 0 0;max-width:680px}
</style></head><body><div class="tools"><div class="group" id="model"><button data-set="flash" class="active">Explicit Flash</button><button data-set="default">Default Decider</button></div><div class="group" id="metric"><button data-metric="p50" class="active">Median</button><button data-metric="p95">p95</button></div></div><p class="context" id="context"></p><div class="plot" id="plot"></div><p class="note" id="note"></p><script>
const data={"flash": {"context": "11 tasks \u00d7 2 rounds \u00b7 3 domains \u00b7 public SDK", "note": "22/22 correct per arm. No wrong direct results. p95 is the second-largest sample.", "rows": [{"name": "New observer \u00b7 Flash + fallback", "arm": "runtime", "workload": "overall", "runs": 22, "passed": 22, "wrongAccept": 0, "direct": 20, "fallback": 2, "falseEmpty": 0, "errors": 0, "p50": 437.2525830000013, "p95": 1965.2676250000004, "meanInputTokens": 2372.090909090909}, {"name": "Ordinary Luna", "arm": "luna", "workload": "overall", "runs": 22, "passed": 22, "wrongAccept": 0, "direct": 0, "fallback": 0, "falseEmpty": 0, "errors": 0, "p50": 1426.2956669999985, "p95": 2233.3309579999986, "meanInputTokens": 776.9090909090909}]}, "default": {"context": "11 tasks \u00d7 1 round \u00b7 same 3 domains \u00b7 separate live session", "note": "11/11 correct per arm. Default Decider median improved; tail was nearly flat versus Luna. p95 is the maximum.", "rows": [{"name": "New observer \u00b7 default Decider", "arm": "runtime", "workload": "overall", "runs": 11, "passed": 11, "wrongAccept": 0, "direct": 10, "fallback": 1, "falseEmpty": 0, "errors": 0, "p50": 587.8142920000028, "p95": 2902.043292000002, "meanInputTokens": 2371.3636363636365}, {"name": "Historical Decider observer", "arm": "legacy", "workload": "overall", "runs": 11, "passed": 11, "wrongAccept": 0, "direct": 8, "fallback": 3, "falseEmpty": 0, "errors": 0, "p50": 1672.5637920000008, "p95": 4250.566500000001, "meanInputTokens": 2119.818181818182}, {"name": "Ordinary Luna", "arm": "luna", "workload": "overall", "runs": 11, "passed": 11, "wrongAccept": 0, "direct": 0, "fallback": 0, "falseEmpty": 0, "errors": 0, "p50": 1570.283915999993, "p95": 2881.499083999999, "meanInputTokens": 776.9090909090909}]}};let set='flash',metric='p50';function render(){const d=data[set],maximum=Math.ceil(Math.max(...d.rows.map(r=>r[metric]))/500)*500;document.querySelector('#context').textContent=d.context;document.querySelector('#note').textContent=d.note+' Navigation/setup excluded; capture, decisions, evidence recheck and fallback included.';document.querySelector('#plot').innerHTML=d.rows.map(r=>`<div class="row ${r.arm==='legacy'?'old':r.arm==='luna'?'luna':''}"><div class="label"><span>${r.name}</span><span class="value">${Math.round(r[metric]).toLocaleString()} ms</span></div><div class="track"><div class="bar" style="width:${r[metric]/maximum*100}%"></div></div></div>`).join('')+`<div class="axis"><span>0</span><span>${(maximum/2).toLocaleString()} ms</span><span>${maximum.toLocaleString()} ms</span></div>`;document.querySelectorAll('[data-set]').forEach(b=>b.classList.toggle('active',b.dataset.set===set));document.querySelectorAll('[data-metric]').forEach(b=>b.classList.toggle('active',b.dataset.metric===metric));}document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{set=b.dataset.set;render()});document.querySelectorAll('[data-metric]').forEach(b=>b.onclick=()=>{metric=b.dataset.metric;render()});render();
</script></body></html>
